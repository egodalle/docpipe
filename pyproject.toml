[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docpipe"
version = "1.0.0"
description = "Postgres + pgvector ingest and retrieval pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "psycopg[binary]>=3.1",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "google-cloud-aiplatform>=1.70",
    "google-genai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-cloud-bigquery>=3.25",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
docpipe = "docpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
