# Merge to main runs Dataform against BigQuery (ADR 0010).
# Pull requests compile only — no GCP auth, no BigQuery spend.
# Cloud SQL is not used.

name: Dataform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dataform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dataform/package-lock.json
      - name: Compile
        working-directory: dataform
        run: |
          npm ci
          npx dataform compile

  run:
    name: run
    needs: compile
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: docpipe-p1
      GCP_LOCATION: us-east1
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          service_account: sa-docpipe-ci@docpipe-p1.iam.gserviceaccount.com
          workload_identity_provider: projects/129492415939/locations/global/workloadIdentityPools/github/providers/github
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dataform/package-lock.json
      - name: Run assertions
        working-directory: dataform
        run: |
          printf '{"projectId":"%s","location":"%s"}\n' "$GCP_PROJECT_ID" "$GCP_LOCATION" > .df-credentials.json
          npm ci
          npx dataform run --timeout 10m
