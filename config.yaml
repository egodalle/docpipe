# Frozen P1 model IDs. Changing these requires an ADR 0003 amendment
# and, if dim changes, ALTER TABLE embeddings plus sql/001_init.sql.
embedding:
  model: text-embedding-004
  dim: 768
  batch_size: 12
generation:
  model: gemini-3-flash-preview
  location: global
serve:
  refuse_min_score: 0.60
  question_max_chars: 2000
  k_default: 5
  k_max: 8
  max_context_chars: 6000
eval:
  unique_documents: true
  pool_k: 15
chunk:
  strategy: recursive_400_80
  size: 400
  overlap: 80
gcp:
  project: docpipe-p1
  location: us-east1
